<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ĐẠI HỌC UEH</title>
    
    <!-- Nhúng thư viện Animate.css giống trong hình -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />

    <style>
        div.at-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
        }

        .at-item {
            color: #3079ed;
            font-weight: bold;
            font-size: 3em;
            font-family: 'Times New Roman', Times, serif;
            animation: text-shadow-multicolor2 2.2s ease 0s infinite alternate none;
        }

        @keyframes text-shadow-multicolor2 {
            0% {
                text-shadow: 0 0 black, 0 0 red, 0 0 orange, 0 0 yellow, 0 0 green, 0 0 skyblue, 0 0 blue;
                transform: translateX(0) translateY(0);
            }
            100% {
                text-shadow: -1px -1px black, -3px -3px red, -5px -5px orange, -7px -7px yellow, -9px -9px green, -11px -11px skyblue, -13px -13px blue;
                transform: translateX(8px) translateY(8px);
            }
        }

        /* Tùy chỉnh thêm để logo không bị quá to và không bị cắt khi quay */
        .logo-ueh {
            width: 300px;
            margin-top: 50px;
            margin-left: 50px;
        }
    </style>
</head>
<body>
    <div class='at-container'>
        <div class='at-item'>ĐẠI HỌC UEH</div>
    </div>

    <!-- Thêm class animate__infinite để quay không ngừng -->
    <img 
        class="logo-ueh animate__animated animate__rotateIn animate__infinite" 
        src="https://ueh.edu.vn/schools/college/images/logo/bit-header-logo.png" 
        alt="Logo Khoa Công nghệ thông tin Kinh doanh UEH"
    >
</body>
</html>
