<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Bài tập 7 - Bố cục trang</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, Helvetica, sans-serif;
    }
    #wrapper {
      position: relative;
      width: 420px;
      margin: 50px auto 20px;
      padding: 8px;
      box-sizing: border-box;
      border: 3px solid #000;
      background-color: #fff;
      box-shadow: -12px 12px 16px #999;
    }
    #wrapper::before {
      content: "wrapper";
      position: absolute;
      top: -34px;
      left: 0;
      font-size: 22px;
    }
    header, nav, main, footer {
      box-sizing: border-box;
      border: 2px solid #000;
      padding: 4px 6px;
      font-size: 22px;
    }
    header {
      height: 55px;
      margin-bottom: 8px;
    }
    nav {
      float: left;
      width: 60px;
      height: 230px;
      margin-bottom: 8px;
    }
    main {
      float: right;
      width: calc(100% - 68px);
      height: 230px;
      margin-bottom: 8px;
    }
    footer {
      clear: both;
      height: 40px;
      padding-top: 0;
    }
    /* Nhãn hiển thị trong từng khối (HTML giữ nguyên rỗng như đề bài) */
    header::before { content: "header"; }
    nav::before    { content: "nav"; }
    main::before   { content: "main"; }
    footer::before { content: "footer"; }
  </style>
</head>
<body>
<div id="wrapper">
<header> </header>
<nav> </nav>
<main> </main>
<footer> </footer>
</div>
</body>
</html>
