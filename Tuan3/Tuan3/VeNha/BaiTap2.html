<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Bài tập 2 - Định dạng đoạn văn</title>
  <style>
    /* 2d. Logo BIT 30px làm hình nền, lặp lại và cố định */
    body {
      font-family: Arial, sans-serif;
      background-image: url("images/BIT_logo.jpg");
      background-size: 30px;
      background-repeat: repeat;
      background-attachment: fixed;
    }

    /* 2a. Đại học UEH: chữ xanh, canh giữa, in đậm, gạch chân, 30px */
    .ueh {
      color: blue;
      text-align: center;
      font-weight: bold;
      text-decoration: underline;
      font-size: 30px;
    }

    /* 2b. Khoa CNTTKD: chữ đỏ, canh phải, in nghiêng, viền chấm vàng bo góc,
       nền xám, 15px, chữ mờ 50% */
    .cntt {
      color: rgba(255, 0, 0, 0.5);
      text-align: right;
      font-style: italic;
      border: 3px dotted yellow;
      border-radius: 12px;
      background-color: gray;
      font-size: 15px;
      padding: 8px 12px;
    }

    /* 2c. Chữ BIT-UEH giống hình mẫu: chữ xanh lá, bóng đỏ sẫm, nền xanh nhạt mờ dần */
    .bit-ueh {
      display: table;
      margin: 10px 0;
      padding: 22px 28px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 36px;
      font-weight: bold;
      color: #a5e03a;
      background: radial-gradient(ellipse at center, #d3e6a3 0%, #e4efc6 55%, #fbfbf4 100%);
      text-shadow: 3px 3px 4px #8b0010, 0 0 8px #b00000, 0 0 16px #c03000;
    }

    /* 2e. Đoạn văn: rộng 100px; cao 50px; ẩn nội dung tràn (i);
       cắt phần tràn bằng "..." (ii); không xuống dòng (iii) */
    .doan-van {
      width: 100px;
      height: 50px;
      overflow: hidden;              /* i  */
      text-overflow: ellipsis;       /* ii */
      white-space: nowrap;           /* iii */
      border: 1px solid #000;
      background-color: #fff;
    }
  </style>
</head>
<body>
  <p class="ueh">Đại học UEH</p>

  <p class="cntt">Khoa CNTTKD</p>

  <p class="bit-ueh">BIT-UEH</p>

  <p class="doan-van">Nhu cầu xã hội Ngành Thương mại điện tử (TMĐT) tại Việt Nam hiện nay đang có những bước tăng trưởng mạnh mẽ và ngày càng đóng góp nhiều hơn cho sự phát triển kinh tế xã hội của đất nước. Thị trường TMĐT Việt Nam đã trở nên sôi động hơn khi có nhiều</p>
</body>
</html>
