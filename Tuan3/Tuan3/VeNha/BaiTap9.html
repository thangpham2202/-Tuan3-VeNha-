<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Bài tập 9 - Font Awesome</title>
  <!-- Nhúng Font Awesome bằng CDN -->
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, Helvetica, sans-serif;
      color: #333;
      text-align: center;
    }
    /* Menu của bài 4 có thêm icon */
    .menu {
      list-style: none;
      margin: 20px 0;
      padding: 0;
    }
    .menu li {
      display: inline-block;
      width: 140px;
      margin: 0 4px;
      padding: 8px 0;
      background-color: cyan;
      font-size: 20px;
    }
    .menu a {
      color: #004e7a;
      text-decoration: none;
    }
    .menu i {
      margin-right: 6px;
    }
    /* Trang landing của bài 5 có thêm icon */
    .best-shared h2 {
      font-size: 48px;
      font-weight: normal;
      margin: 30px 0 10px;
    }
    .best-shared h2 strong {
      color: #00a8e8;
    }
    .lead-text {
      font-size: 14px;
      margin: 20px 0 30px;
    }
    .btn-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .btn-list li {
      display: inline-block;
      margin: 0 12px;
    }
    .btn-list a {
      display: inline-block;
      padding: 16px 34px;
      background-color: #2b2f33;
      color: #fff;
      font-size: 14px;
      text-decoration: none;
      border-radius: 3px;
    }
    .btn-list i {
      margin-right: 8px;
    }
    .icons {
      margin-top: 40px;
      font-size: 32px;
    }
    .icons i {
      margin: 0 12px;
    }
  </style>
</head>
<body>
  <ul class="menu">
    <li><a href="#"><i class="fa-solid fa-cart-shopping"></i>TMDT</a></li>
    <li><a href="#"><i class="fa-solid fa-gears"></i>ERP</a></li>
    <li><a href="#"><i class="fa-solid fa-chart-line"></i>MIS</a></li>
    <li><a href="#"><i class="fa-solid fa-database"></i>DS</a></li>
  </ul>

  <section class="best-shared">
    <h2><i class="fa-solid fa-server"></i> Best <strong>Shared Hosting</strong> Company</h2>
    <p class="lead-text">With this responsive landing page template, you can promote your all hosting, domain and email services.</p>
    <ul class="btn-list">
      <li><a href="./"><i class="fa-solid fa-list-check"></i>View Plans</a></li>
      <li><a href="./"><i class="fa-solid fa-star"></i>All Features</a></li>
    </ul>
  </section>

  <div class="icons">
    <i class="fa-brands fa-github"></i>
    <i class="fa-brands fa-facebook"></i>
    <i class="fa-brands fa-linkedin"></i>
    <i class="fa-solid fa-envelope"></i>
    <i class="fa-solid fa-graduation-cap"></i>
  </div>
</body>
</html>
