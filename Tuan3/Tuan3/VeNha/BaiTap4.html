<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Bài tập 4 - Menu ngang</title>
  <style>
    ul {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    li {
      display: inline-block;          /* các li nằm trên cùng một hàng */
      width: 120px;
      margin-right: 6px;
      padding: 4px 0;
      background-color: cyan;
      text-align: center;
      font-size: 24px;
      font-family: "Times New Roman", serif;
    }
  </style>
</head>
<body>
  <ul>
    <li><a href="#">TMDT</a></li>
    <li><a href="#">ERP</a></li>
    <li><a href="#">MIS</a></li>
    <li><a href="#">DS</a></li>
  </ul>
</body>
</html>
