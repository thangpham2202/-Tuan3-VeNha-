<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hôm nay · Sổ Việc</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%2316322b'/%3E%3Cpath d='M28 52l16 16 30-34' stroke='%23d9622b' stroke-width='11' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css"></head><body>
<header class="topbar"><div class="top-in"><a class="logo" href="index.html"><i>✦</i>Sổ Việc</a><nav class="tabs"><a class="nav on" href="index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg>Hôm nay</a><a class="nav" href="tasks.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Tất cả việc</a><a class="nav" href="stats.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Thống kê</a></nav></div></header>
<main>
<div class="head"><div><h1 id="greet">Xin chào</h1><p id="dateLabel"></p></div><button class="btn" id="addBtn">＋ Thêm việc mới</button></div>
<div class="today"><div>
<form class="quick" id="quick"><input type="text" id="qt" maxlength="120" placeholder="Ghi nhanh một việc cho hôm nay rồi nhấn Enter…" aria-label="Thêm nhanh"><button class="btn" type="submit">Ghi lại</button></form>
<div class="filters"><input class="search" type="search" id="q" placeholder="🔍 Tìm việc…" aria-label="Tìm kiếm">
<select id="pri" aria-label="Lọc ưu tiên"><option value="">Mọi ưu tiên</option><option value="high">Cao</option><option value="medium">Trung bình</option><option value="low">Thấp</option></select>
<select id="cat" aria-label="Lọc danh mục"></select></div>
<div class="chips" id="chips" style="margin-bottom:6px"><button class="chip on" data-s="">Tất cả</button><button class="chip" data-s="todo">Chưa làm</button><button class="chip" data-s="doing">Đang làm</button><button class="chip" data-s="done">Hoàn thành</button></div>
<div id="out"></div></div>
<aside class="panel"><section class="hero"><h2>Tiến độ hôm nay</h2><div class="ring" id="ring"><div><span class="pct" id="pct">0%</span></div></div><p id="sum">Đang tải…</p><div class="bar"><b id="barfill" style="width:0"></b></div></section>
<section class="quote"><small>Lời nhắc trong ngày</small><q id="quoteText"></q><cite id="quoteBy"></cite></section></aside></div>
</main>
<footer class="site-foot">Sổ Việc · Node.js · Express · SQLite</footer>
<script src="js/common.js"></script><script src="js/today.js"></script></body></html>
