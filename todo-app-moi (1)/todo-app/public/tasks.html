<main>
<div class="head"><div><h1>Tất cả công việc</h1><p id="count">Đang tải…</p></div><button class="btn" id="addBtn">＋ Thêm việc mới</button></div>
<div class="filters"><input class="search" type="search" id="q" placeholder="🔍 Tìm theo tiêu đề hoặc mô tả…" aria-label="Tìm kiếm">
<select id="sta" aria-label="Trạng thái"><option value="">Mọi trạng thái</option><option value="open">Chưa xong</option><option value="todo">Chưa làm</option><option value="doing">Đang làm</option><option value="done">Hoàn thành</option></select>
<select id="pri" aria-label="Ưu tiên"><option value="">Mọi ưu tiên</option><option value="high">Cao</option><option value="medium">Trung bình</option><option value="low">Thấp</option></select>
<select id="cat" aria-label="Danh mục"></select>
<select id="sort" aria-label="Sắp xếp"><option value="due">Sắp theo hạn</option><option value="priority">Sắp theo ưu tiên</option><option value="progress">Sắp theo mức hoàn thành</option><option value="newest">Mới thêm trước</option></select></div>
<div id="out"></div>
</main>
